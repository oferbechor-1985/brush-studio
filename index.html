<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0E1113">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}</style>
<title>OBPaint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Secular+One&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen studio. Brush rail beside the canvas (strip under it on phones), tool bar on top. */
:root{
  --bg:#EDF0F2; --ws:#2B3138; --panel:#F7F8F9; --fg:#14181C; --muted:#5A6570; --line:#D3D9DF;
  --accent:#0B7A78; --accent-fg:#FFFFFF; --accent-soft:#D5ECEA; --danger:#B42318;
  --paper-light:#FFFFFF; --paper-dark:#1C1F24;
  --f-ui:'Heebo',system-ui,sans-serif; --f-display:'Secular One','Heebo',system-ui,sans-serif; --f-mono:'DM Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113; --ws:#050607; --panel:#171B1E; --fg:#E7ECEF; --muted:#8D99A2; --line:#2B3338;
    --accent:#3FC8C2; --accent-fg:#06201F; --accent-soft:#12302F; --danger:#F97066; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113; --ws:#050607; --panel:#171B1E; --fg:#E7ECEF; --muted:#8D99A2; --line:#2B3338;
  --accent:#3FC8C2; --accent-fg:#06201F; --accent-soft:#12302F; --danger:#F97066; color-scheme:dark;
}
html{box-sizing:border-box;height:100%;overscroll-behavior:none}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overscroll-behavior:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
#app{height:100%}
#app[data-paper="light"]{--paper-cur:var(--paper-light)}
#app[data-paper="dark"]{--paper-cur:var(--paper-dark)}

h1{font:400 21px/1 var(--f-display);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font:500 12px/1 var(--f-ui);letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.grp{display:flex;align-items:center;gap:6px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px var(--f-ui);
  min-height:44px;min-width:44px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.warn{border-color:var(--danger);color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.colors{flex-wrap:wrap;max-width:100%}
#color{width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}

.ctl{display:grid;grid-template-columns:64px minmax(0,1fr) 40px;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ctl input[type=range]{width:100%;accent-color:var(--accent);min-height:44px}
.ctl output{font:500 12px var(--f-mono);min-width:3ch;color:var(--fg);font-variant-numeric:tabular-nums;text-align:end}
.ctl select{grid-column:2 / 4;min-height:44px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:0 10px;font:inherit}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.stat{font:400 12px var(--f-mono);color:var(--muted);padding:8px 10px;border:1px dashed var(--line);border-radius:8px;min-width:0}

.brushes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.brush{appearance:none;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:6px;border:1px solid var(--line);border-radius:10px;
  background:transparent;color:var(--fg);font:500 12px var(--f-ui);cursor:pointer;min-width:0}
.brush[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.pv{width:100%;height:40px;border-radius:6px;background:var(--paper-cur);display:block}
.brush span{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stage{position:fixed;inset:0;overflow:hidden;background:var(--ws);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.stage canvas{position:absolute;top:0;left:0;display:block}
#live{pointer-events:none}
.hint{position:absolute;inset-inline-start:16px;bottom:calc(14px + env(safe-area-inset-bottom, 0px));max-width:calc(100% - 32px);padding:8px 12px;border-radius:8px;background:var(--panel);color:var(--muted);
  border:1px solid var(--line);font-size:12px;pointer-events:none;text-wrap:balance}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,12,14,.66);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:14px;max-width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;overflow:auto}
.card img{max-width:100%;max-height:60vh;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#0E1113;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.card p{margin:0;font-size:13px;color:var(--muted);text-wrap:balance}
.card .row{display:flex;gap:8px;flex-wrap:wrap}

/* floating quick tools + side drawer */
.fab{position:fixed;z-index:10;top:calc(env(safe-area-inset-top, 0px) + 10px);inset-inline-start:max(16px, env(safe-area-inset-right, 0px));
  display:flex;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.fab .btn{position:relative}
.dot{position:absolute;inset-inline-end:4px;bottom:4px;width:13px;height:13px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);background:#14181c}
.drawer{position:fixed;z-index:15;top:0;bottom:0;inset-inline-start:0;width:min(360px,88vw);overflow-y:auto;overscroll-behavior:contain;
  background:var(--panel);border-inline-end:1px solid var(--line);box-shadow:-8px 0 28px rgba(0,0,0,.28);
  padding:calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) 16px;
  display:flex;flex-direction:column;gap:22px;transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.drawer.open{transform:none;visibility:visible;transition:transform .22s ease}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.drawer section{min-width:0}
.stack{display:flex;flex-direction:column;gap:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;background:var(--paper-cur);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 8px 32px rgba(0,0,0,.5)}
.fab .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#zoomReset{font:500 12px var(--f-mono);min-width:56px;font-variant-numeric:tabular-nums}
.ver{margin:0;font:400 11px var(--f-mono);color:var(--muted)}
.ttl{font:500 17px var(--f-ui);margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);font:500 13px var(--f-ui);min-height:44px;padding:0 14px;border-radius:22px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#fbText{width:100%;min-height:120px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px/1.5 var(--f-ui)}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;opacity:0}
.card.wide{width:min(520px,100%)}
.cpbtn{padding:0;width:44px}
.cpdot{width:26px;height:26px;border-radius:50%;background:#14181c;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.cp{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.sv{position:relative;height:170px;border-radius:10px;touch-action:none;cursor:crosshair;border:1px solid var(--line);
  background:linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,rgba(255,255,255,0)),var(--hc,#f00)}
.svt{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 1px 4px rgba(0,0,0,.5);pointer-events:none}
.hue{-webkit-appearance:none;appearance:none;display:block;width:100%;height:26px;margin:0;border-radius:13px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:transparent;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 1px 4px rgba(0,0,0,.5)}
.hue::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:transparent;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.hex{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:0 12px;font:16px var(--f-mono)}
.vpanel{position:fixed;z-index:12;bottom:calc(14px + env(safe-area-inset-bottom, 0px));inset-inline:0;margin-inline:auto;width:min(420px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 28px rgba(0,0,0,.4)}
.vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vrow label{width:48px;font-size:13px;color:var(--muted)}
.vrow input[type=number]{width:84px;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:0 10px;font:16px var(--f-mono);text-align:center}
.vrow input[type=range]{flex:1;min-width:120px;accent-color:var(--accent);min-height:44px}
.vrow output{font:500 12px var(--f-mono);min-width:5ch;text-align:end;font-variant-numeric:tabular-nums}
#pframe{--hs:calc(46px*var(--iz,1));position:absolute;pointer-events:none;outline:calc(2px*var(--iz,1)) solid #ffd400;background:rgba(255,212,0,.1);z-index:5}
#pframe[data-mode=image]{background:none}
.ph{position:absolute;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center}
.ph::after{content:"";width:calc(18px*var(--iz,1));height:calc(18px*var(--iz,1));background:#ffd400;border:calc(2px*var(--iz,1)) solid #3d3000;border-radius:calc(4px*var(--iz,1));pointer-events:none}
.ph.body{inset:0;z-index:1}.ph.body::after{display:none}
.ph.n,.ph.s{left:0;right:0;height:var(--hs);z-index:2}
.ph.e,.ph.w{top:0;bottom:0;width:var(--hs);z-index:2}
.ph.n{top:calc(var(--hs)/-2)}.ph.s{bottom:calc(var(--hs)/-2)}
.ph.w{left:calc(var(--hs)/-2)}.ph.e{right:calc(var(--hs)/-2)}
.ph.nw,.ph.ne,.ph.sw,.ph.se{width:var(--hs);height:var(--hs);z-index:3}
.ph.nw{left:calc(var(--hs)/-2);top:calc(var(--hs)/-2)}.ph.ne{right:calc(var(--hs)/-2);top:calc(var(--hs)/-2)}
.ph.sw{left:calc(var(--hs)/-2);bottom:calc(var(--hs)/-2)}.ph.se{right:calc(var(--hs)/-2);bottom:calc(var(--hs)/-2)}
#pframe[data-mode=image] .ph.n,#pframe[data-mode=image] .ph.s,#pframe[data-mode=image] .ph.e,#pframe[data-mode=image] .ph.w{display:none}
#pframe[data-mode=page] .ph.body{display:none}
#cmark{position:absolute;pointer-events:none;z-index:4;transform:translate(-50%,-50%);border-radius:50%;border:calc(2px*var(--iz,1)) solid #fff;box-shadow:0 0 0 calc(1px*var(--iz,1)) #000,inset 0 0 0 calc(1px*var(--iz,1)) #000}
#cmark::before,#cmark::after{content:"";position:absolute;left:50%;top:50%;background:#fff;box-shadow:0 0 0 calc(1px*var(--iz,1)) #000;transform:translate(-50%,-50%)}
#cmark::before{width:calc(14px*var(--iz,1));height:calc(2px*var(--iz,1))}
#cmark::after{width:calc(2px*var(--iz,1));height:calc(14px*var(--iz,1))}
.pill{position:fixed;z-index:11;bottom:calc(14px + env(safe-area-inset-bottom, 0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 16px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:0 6px 28px rgba(0,0,0,.4)}
.loupe{position:fixed;z-index:15;width:64px;height:64px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.5);pointer-events:none;transform:translate(-50%,-100%)}
#ish{position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset calc(var(--ft,28px)*.12) calc(var(--ft,28px)*.2) calc(var(--ft,28px)*1.1) rgba(45,28,6,.55),inset 0 0 calc(var(--ft,28px)*.8) rgba(45,28,6,.28)}
#wf{position:absolute;inset:calc(var(--ft,28px)*-1);pointer-events:none;z-index:3;box-shadow:0 calc(var(--ft,28px)*.35) calc(var(--ft,28px)*1.2) rgba(0,0,0,.55)}
#wf i{position:absolute;inset:0;display:block}
#wf .t{background:repeating-linear-gradient(0deg,rgba(110,70,25,.07) 0 1px,transparent 1px 6px),linear-gradient(#efd7ae,#dfc08f);clip-path:polygon(0 0,100% 0,calc(100% - var(--ft,28px)) var(--ft,28px),var(--ft,28px) var(--ft,28px))}
#wf .b{background:repeating-linear-gradient(0deg,rgba(110,70,25,.07) 0 1px,transparent 1px 6px),linear-gradient(#c9a673,#b58d5a);clip-path:polygon(0 100%,100% 100%,calc(100% - var(--ft,28px)) calc(100% - var(--ft,28px)),var(--ft,28px) calc(100% - var(--ft,28px)))}
#wf .l{background:repeating-linear-gradient(90deg,rgba(110,70,25,.07) 0 1px,transparent 1px 6px),linear-gradient(90deg,#e0c293,#d2b180);clip-path:polygon(0 0,var(--ft,28px) var(--ft,28px),var(--ft,28px) calc(100% - var(--ft,28px)),0 100%)}
#wf .r{background:repeating-linear-gradient(90deg,rgba(110,70,25,.07) 0 1px,transparent 1px 6px),linear-gradient(90deg,#c19d6a,#b08855);clip-path:polygon(100% 0,100% 100%,calc(100% - var(--ft,28px)) calc(100% - var(--ft,28px)),calc(100% - var(--ft,28px)) var(--ft,28px))}
#wf::before{content:"";position:absolute;inset:0;z-index:1;box-shadow:inset 0 0 0 calc(1px*var(--iz,1)) rgba(255,240,210,.55)}
#wf::after{content:"";position:absolute;inset:var(--ft,28px);z-index:1;box-shadow:0 0 0 calc(1.5px*var(--iz,1)) rgba(70,45,15,.65),0 0 0 calc(3px*var(--iz,1)) rgba(255,235,200,.22)}
.actions .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app" data-paper="light" dir="rtl" lang="he">
  <main class="stage" id="stage">
    <div id="world"><canvas id="main"></canvas><canvas id="live"></canvas><div id="ish"></div><div id="wf"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div><div id="cmark" hidden></div>
      <div id="pframe" hidden data-mode="page"><div class="ph body" data-k="body"></div><div class="ph n" data-k="n"></div><div class="ph s" data-k="s"></div><div class="ph e" data-k="e"></div><div class="ph w" data-k="w"></div><div class="ph nw" data-k="nw"></div><div class="ph ne" data-k="ne"></div><div class="ph sw" data-k="sw"></div><div class="ph se" data-k="se"></div></div></div>
    <div class="hint" id="hint">פתחו את האפשרויות מהכפתור למעלה, ו"נקה" פותח דף חלק.</div>
  </main>

  <div class="fab" role="group" aria-label="כלים מהירים">
    <button class="btn" id="menu" aria-label="אפשרויות" aria-expanded="false" aria-controls="drawer" title="אפשרויות"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg><span class="dot" id="dot"></span></button>
    <button class="btn" id="undo" aria-label="בטל" title="בטל (Ctrl+Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="btn" id="redo" aria-label="החזר" title="החזר (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button class="btn" id="hand" aria-label="זכוכית מגדלת" aria-pressed="false" title="זכוכית מגדלת: גרירה בעט או באצבע מזיזה את הציור. צביטה בשתי אצבעות מגדילה תמיד."><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M8 10.5h5M10.5 8v5"/></svg></button>
    <button class="btn" id="viewBtn" aria-expanded="false" aria-controls="vp" title="זום וסיבוב" style="font:500 12px var(--f-mono);min-width:64px">100%</button>
  </div>

  <div class="vpanel" id="vp" hidden role="group" aria-label="זום וסיבוב">
    <div class="vrow">
      <label for="ang">זווית</label>
      <input id="ang" type="number" inputmode="decimal" step="1" value="0" dir="ltr">
      <span aria-hidden="true">°</span>
      <button class="btn" dir="ltr" id="aM" aria-label="סיבוב 90 מעלות שמאלה">−90</button>
      <button class="btn" dir="ltr" id="aP" aria-label="סיבוב 90 מעלות ימינה">+90</button>
      <button class="btn" id="aZ" title="זווית בסיסית">0</button>
    </div>
    <div class="vrow">
      <label for="zm">זום</label>
      <input id="zm" type="range" min="0" max="100" step="1" value="60">
      <output id="zmOut">100%</output>
    </div>
    <div class="vrow">
      <button class="btn" id="vFit">התאם לדף</button>
      <button class="btn" id="v100">100%</button>
      <button class="btn" id="vClose">סגור</button>
    </div>
  </div>

  <div class="vpanel" id="pf" hidden role="group" aria-label="גודל הדף">
    <div class="vrow"><strong id="pfInfo" dir="ltr" style="font:500 14px var(--f-mono)"></strong></div>
    <div class="vrow"><span id="pfHelp" style="font-size:12px;color:var(--muted)"></span></div>
    <div class="vrow"><button class="btn" id="pfOk">אישור</button><button class="btn" id="pfReset">איפוס</button><button class="btn" id="pfCancel">ביטול</button></div>
  </div>
  <div class="pill" id="pill" hidden><span id="pillTxt"></span><button class="btn" id="pillBtn" hidden>מקור חדש</button></div>
  <div class="loupe" id="loupe" hidden></div>

  <aside class="drawer" id="drawer" aria-label="אפשרויות ציור">
    <div class="dhead">
      <h1 dir="ltr">OBPaint</h1>
      <button class="btn" id="dclose" aria-label="סגור אפשרויות"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <section><h2>מברשות</h2><nav class="brushes" id="brushes" aria-label="מברשות"></nav></section>
    <section><h2>צבע</h2>
      <div class="grp colors" role="group" aria-label="צבע">

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const R=Math.random, TAU=Math.PI*2;
const DPR=Math.min(2,window.devicePixelRatio||1);
const PALM=44; // css px; contacts wider than this are treated as a palm

/* ---------- colour helpers ---------- */
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];};
const css=(r,g,b,a=1)=>`rgba(${r|0},${g|0},${b|0},${a})`;
const shade=(rgb,amt)=>rgb.map(v=>Math.max(0,Math.min(255,v+amt*255)));
const mix=(rgb,w)=>rgb.map(v=>v+(255-v)*w);
function hueOf([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return (h*60+360)%360;}
const paint=hex=>{const rgb=hex2rgb(hex);return {color:hex,rgb,hue:hueOf(rgb)};};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mkc=(d,rf)=>{const cv=document.createElement('canvas');cv.width=cv.height=d;return {cv,c:cv.getContext('2d',rf?{willReadFrequently:true}:undefined)};};

/* ---------- brushes ----------
   sp: dab spacing as a fraction of size, mul: size multiplier, layered: stroke drawn on a
   private layer so opacity does not build up inside one stroke, cb: blend used on commit. */
const BR=[
 {id:'pencil',name:'עיפרון',size:4,pv:6,sp:.12,
  dab(c,p){const r=p.s*.5*(.5+.5*p.pr),n=Math.ceil(r*2.4+2);c.fillStyle=p.color;
    for(let i=0;i<n;i++){const a=R()*TAU,d=Math.sqrt(R())*r;c.globalAlpha=p.base*(.25+R()*.5)*(.5+.6*p.pr);c.fillRect(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,1.1,1.1);}}},
 {id:'ballpoint',name:'עט כדורי',size:4,pv:5,sp:.08,layered:true,
  dab(c,p){c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,Math.max(.5,p.s*.5*(.7+.3*p.pr)),0,TAU);c.fill();}},
 {id:'ink',name:'דיו',size:14,pv:12,sp:.06,layered:true,
  dab(c,p){c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,Math.max(.4,p.s*.5*(.18+.95*Math.pow(p.pr,1.3))),0,TAU);c.fill();}},
 {id:'marker',name:'טוש',size:16,pv:12,sp:.08,layered:true,alpha:.9,
  dab(c,p){c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,p.s*.5*(.9+.1*p.pr),0,TAU);c.fill();}},
 {id:'highlighter',name:'מדגיש',size:16,pv:12,sp:.06,mul:2.4,layered:true,alpha:.55,cb:'multiply',
  dab(c,p){c.fillStyle=p.color;c.fillRect(p.x-p.s*.2,p.y-p.s*.5,p.s*.4,p.s);}},
 {id:'calligraphy',name:'קליגרפיה',size:18,pv:16,sp:.05,layered:true,
  dab(c,p){c.fillStyle=p.color;c.beginPath();c.ellipse(p.x,p.y,Math.max(.8,p.s*.5*(.6+.4*p.pr)),Math.max(.6,p.s*.1),-.7,0,TAU);c.fill();}},
 {id:'oil',name:'שמן',size:40,pv:20,sp:.1,
  init(s){const a=[];for(let i=0;i<18;i++){const t=R()*TAU,d=Math.sqrt(R())*.5;a.push({ox:Math.cos(t)*d,oy:Math.sin(t)*d,r:.045+R()*.06,col:css(...shade(s.rgb,(R()-.5)*.3)),a:.55+R()*.4});}return a;},
  dab(c,p,rs){const k=.5+.5*p.pr;for(const b of rs){c.globalAlpha=p.base*b.a;c.fillStyle=b.col;c.beginPath();c.arc(p.x+b.ox*p.s*k,p.y+b.oy*p.s*k,Math.max(.6,b.r*p.s),0,TAU);c.fill();}}},
 {id:'watercolor',name:'צבעי מים',size:44,pv:22,sp:.15,pad:1.4,
  dab(c,p){const r=p.s*.6*(.6+.5*p.pr);c.fillStyle=p.color;c.strokeStyle=p.color;
    for(let k=0;k<2;k++){c.globalAlpha=p.base*.05;c.beginPath();c.arc(p.x+(R()-.5)*r*.5,p.y+(R()-.5)*r*.5,r*(.8+R()*.4),0,TAU);c.fill();}
    c.globalAlpha=p.base*.025;c.lineWidth=1;c.beginPath();c.arc(p.x,p.y,r,0,TAU);c.stroke();}},
 {id:'airbrush',name:'אירבראש',size:50,pv:22,sp:.12,pad:1.1,
  dab(c,p){const r=p.s*.9,g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,r),a=p.base*.12*(.4+.8*p.pr);
    g.addColorStop(0,css(...p.rgb,a));g.addColorStop(1,css(...p.rgb,0));c.globalAlpha=1;c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,r,0,TAU);c.fill();}},
 {id:'spray',name:'ספריי',size:50,pv:20,sp:.2,pad:1,
  dab(c,p){const n=Math.ceil(p.s*1.6*(.5+p.pr)),r=p.s*.7;c.fillStyle=p.color;c.globalAlpha=p.base*.85;
    for(let i=0;i<n;i++){const a=R()*TAU,d=r*R()*Math.sqrt(R());c.beginPath();c.arc(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,.5+R()*.9,0,TAU);c.fill();}}},
 {id:'charcoal',name:'פחם',size:24,pv:16,sp:.12,
  dab(c,p){const n=Math.ceil(p.s*.9*(.4+p.pr)),r=p.s*.5;c.fillStyle=p.color;
    c.globalAlpha=p.base*.02;c.beginPath();c.arc(p.x,p.y,r,0,TAU);c.fill();
    for(let i=0;i<n;i++){const a=R()*TAU,d=Math.sqrt(R())*r;c.globalAlpha=p.base*(.08+R()*.4);c.fillRect(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,.6+R()*2.4,.6+R()*2.4);}}},
 {id:'crayon',name:'צבע שעווה',size:20,pv:14,sp:.15,
  dab(c,p){const n=Math.ceil(p.s*1.2),r=p.s*.5*(.6+.4*p.pr);c.fillStyle=p.color;
    for(let i=0;i<n;i++){if(R()<(1-p.pr)*.5)continue;const a=R()*TAU,d=Math.sqrt(R())*r;c.globalAlpha=p.base*(.5+R()*.4);c.fillRect(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,1.5+R()*2,1.5+R()*2);}}},
 {id:'neon',name:'ניאון',size:12,pv:8,sp:.15,pad:3,
  dab(c,p){const k=.6+.4*p.pr;c.save();c.shadowColor=p.color;c.shadowBlur=p.s*1.1*DPR;c.globalAlpha=p.base;c.fillStyle=p.color;
    c.beginPath();c.arc(p.x,p.y,p.s*.28*k,0,TAU);c.fill();c.restore();
    c.globalAlpha=p.base;c.fillStyle=css(...mix(p.rgb,.8));c.beginPath();c.arc(p.x,p.y,Math.max(.6,p.s*.14*k),0,TAU);c.fill();}},
 {id:'dots',name:'נקודות',size:14,pv:8,sp:1.4,
  dab(c,p){c.globalAlpha=p.base;c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,Math.max(.6,p.s*.5*(.5+.5*p.pr)),0,TAU);c.fill();}},
 {id:'confetti',name:'קונפטי',size:36,pv:14,sp:1.1,pad:1,
  dab(c,p){c.save();c.translate(p.x,p.y);c.rotate(R()*TAU);c.globalAlpha=p.base;c.fillStyle=`hsl(${p.hue+R()*160-80},80%,55%)`;
    const k=p.s*.5*(.5+.5*R()),t=R();c.beginPath();
    if(t<.4){for(let i=0;i<10;i++){const r=i%2?k*.45:k,a=i*Math.PI/5-Math.PI/2;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();}
    else if(t<.7){c.rect(-k,-k*.5,k*2,k);}else{c.arc(0,0,k*.6,0,TAU);}
    c.fill();c.restore();}},
 {id:'pastel',name:'פסטל',size:30,pv:18,sp:.12,
  dab(c,p){const n=Math.ceil(p.s*1.1),r=p.s*.5*(.6+.4*p.pr);c.fillStyle=p.color;
    for(let i=0;i<n;i++){const a=R()*TAU,d=Math.sqrt(R())*r,w=1+R()*2.5;c.globalAlpha=p.base*(.2+R()*.35);c.fillRect(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,w,w);}
    c.globalAlpha=p.base*.05;c.beginPath();c.arc(p.x,p.y,r*.9,0,TAU);c.fill();}},
 {id:'dry',name:'מברשת יבשה',size:30,pv:18,sp:.04,
  init(){const a=[];for(let i=0;i<22;i++)a.push({o:i/21-.5,w:.5+R()*1.2,a:.35+R()*.6,k:R()});return a;},
  dab(c,p,rs){const nx=-Math.sin(p.ang),ny=Math.cos(p.ang);c.fillStyle=p.color;
    for(const b of rs){if(b.k>.35+.65*p.pr)continue;c.globalAlpha=p.base*b.a;c.beginPath();c.arc(p.x+nx*b.o*p.s,p.y+ny*b.o*p.s,b.w,0,TAU);c.fill();}}},
 {id:'sketch',name:'סקיצה',size:8,pv:8,sp:.08,
  init(){return [{o:0},{o:0},{o:0}];},
  dab(c,p,rs){const nx=-Math.sin(p.ang),ny=Math.cos(p.ang);c.fillStyle=p.color;
    for(const b of rs){b.o=clamp(b.o+(R()-.5)*.5,-p.s*.6,p.s*.6);c.globalAlpha=p.base*(.35+.25*p.pr);c.beginPath();c.arc(p.x+nx*b.o,p.y+ny*b.o,Math.max(.4,p.s*.07),0,TAU);c.fill();}}},
 {id:'rainbow',name:'קשת',size:20,pv:12,sp:.07,layered:true,
  init(s){return {h:s.hue};},
  dab(c,p,rs){rs.h=(rs.h+2.2)%360;c.fillStyle=`hsl(${rs.h},85%,55%)`;c.beginPath();c.arc(p.x,p.y,Math.max(.6,p.s*.5*(.6+.4*p.pr)),0,TAU);c.fill();}},
 {id:'fur',name:'פרווה',size:26,pv:16,sp:.18,pad:1.4,
  dab(c,p){c.strokeStyle=p.color;c.lineWidth=1;c.lineCap='round';const L=p.s*.6*(.6+.4*p.pr);
    for(let i=0;i<7;i++){const a=p.ang+Math.PI/2*(R()<.5?1:-1)+(R()-.5)*1.2,l=L*(.4+R()*.6);
      c.globalAlpha=p.base*(.35+R()*.5);c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+Math.cos(a)*l,p.y+Math.sin(a)*l);c.stroke();}}},
 {id:'stars',name:'כוכבים',size:28,pv:12,sp:1.2,pad:1.2,
  dab(c,p){c.save();c.translate(p.x+(R()-.5)*p.s*.5,p.y+(R()-.5)*p.s*.5);c.rotate(R()*TAU);
    const k=p.s*.5*(.35+.65*R());c.globalAlpha=p.base;c.fillStyle=R()<.5?css(...mix(p.rgb,.55)):p.color;
    c.beginPath();for(let i=0;i<8;i++){const r=i%2?k*.28:k,a=i*Math.PI/4;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();c.restore();}},
 {id:'glitter',name:'נצנצים',size:34,pv:16,sp:.22,pad:1,
  dab(c,p){const n=Math.ceil(p.s*.35),r=p.s*.55;
    for(let i=0;i<n;i++){const a=R()*TAU,d=Math.sqrt(R())*r,t=R(),w=.8+R()*2;c.globalAlpha=p.base*(.5+R()*.5);
      c.fillStyle=t<.2?'#ffffff':t<.6?p.color:css(...shade(p.rgb,(R()-.5)*.5));c.fillRect(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,w,w);}}},
 {id:'dashed',name:'מקווקו',size:8,pv:6,sp:.14,layered:true,
  init(){return {n:0};},
  dab(c,p,rs){rs.n++;if(Math.floor(rs.n/5)%2)return;c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,Math.max(.5,p.s*.5*(.7+.3*p.pr)),0,TAU);c.fill();}},
 {id:'ribbon',name:'סרט כפול',size:16,pv:12,sp:.05,layered:true,
  dab(c,p){const nx=-Math.sin(p.ang),ny=Math.cos(p.ang),o=p.s*.5,w=Math.max(.6,p.s*.12*(.6+.4*p.pr));c.fillStyle=p.color;
    for(const g of [-1,1]){c.beginPath();c.arc(p.x+nx*o*g,p.y+ny*o*g,w,0,TAU);c.fill();}}},
 {id:'pixel',name:'פיקסל',size:16,pv:12,sp:.25,layered:true,
  dab(c,p){const g=Math.max(2,Math.round(p.s*.5));c.fillStyle=p.color;c.fillRect(Math.floor(p.x/g)*g,Math.floor(p.y/g)*g,g,g);}},
 {id:'halftone',name:'הלפטון',size:30,pv:16,sp:.12,layered:true,
  dab(c,p){const g=Math.max(4,p.s*.3),cx=(Math.floor(p.x/g)+.5)*g,cy=(Math.floor(p.y/g)+.5)*g;c.fillStyle=p.color;c.beginPath();c.arc(cx,cy,g*.5*(.25+.75*p.pr),0,TAU);c.fill();}},
 {id:'smudge',name:'מריחה',size:36,pv:20,sp:.06,smudge:true,noPv:true,dab(){}},
 {id:'fill',name:'דלי צבע',size:1,pv:1,fill:true,noPv:true,dab(){}},
 {id:'blur',name:'טשטוש',size:40,pv:20,sp:.1,fx:'blur',noPv:true,dab(){}},
 {id:'sharpen',name:'חדות',size:40,pv:20,sp:.1,fx:'sharpen',noPv:true,dab(){}},
 {id:'clone',name:'שכפול',size:40,pv:20,sp:.08,clone:true,noPv:true,dab(){}},
 {id:'pick',name:'פיפטה',size:1,pv:1,pick:true,noPv:true,dab(){}},
 {id:'eraser',name:'מחק',size:30,pv:10,sp:.1,erase:true,
  dab(c,p){c.globalAlpha=p.base;c.fillStyle='#000';c.beginPath();c.arc(p.x,p.y,p.s*.5,0,TAU);c.fill();}}
];

/* ---------- stroke engine ---------- */
const softG=(c,d)=>{const g=c.createRadialGradient(d/2,d/2,0,d/2,d/2,d/2);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.55,'rgba(0,0,0,.85)');g.addColorStop(1,'rgba(0,0,0,0)');return g;};
/* replaces a soft round patch of the canvas with S (a d x d canvas holding the new pixels), at strength a */
function softBlend(c,S,sx,sy,a){
  const d=S.cv.width,sc=S.c;
  sc.globalCompositeOperation='destination-in';sc.globalAlpha=1;sc.fillStyle=softG(sc,d);sc.fillRect(0,0,d,d);sc.globalCompositeOperation='source-over';

function doFill(x,y){
  const w=main.width,h=main.height,sx=Math.floor(x*DPR),sy=Math.floor(y*DPR);

    if(l<bx0)bx0=l;if(r>bx1)bx1=r;if(yy<by0)by0=yy;if(yy>by1)by1=yy;

    }

  for(let yy=by0;yy<=by1;yy++)for(let xx=bx0;xx<=bx1;xx++){
    const p=yy*w+xx;if(mask[p]!==1)continue;
    if((xx>0&&!mask[p-1])||(xx<w-1&&!mask[p+1])||(yy>0&&!mask[p-w])||(yy<h-1&&!mask[p+w])){
      for(let dy=-rd;dy<=rd;dy++)for(let dx=-rd;dx<=rd;dx++){const nx=xx+dx,ny=yy+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const q=ny*w+nx;if(!mask[q])mask[q]=2;}

    }else if(da<1){

    }

      else{
        const ar=(o.r-o.l)/(o.b-o.t),W_=k.includes('w'),N_=k.includes('n'),ax=W_?o.r:o.l,ay=N_?o.b:o.t,mx=W_?o.l+dx:o.r+dx,my=N_?o.t+dy:o.b+dy;
        const w=Math.max(Math.abs(mx-ax),Math.abs(my-ay)*ar,30),hh=w/ar;
        n.l=W_?ax-w:ax;n.r=W_?ax:ax+w;n.t=N_?ay-hh:ay;n.b=N_?ay:ay+hh;
      }
    }else{
      if(k.includes('w'))n.l=Math.min(Math.round(o.l+dx),o.r-MINP);
      if(k.includes('e'))n.r=Math.max(Math.round(o.r+dx),o.l+MINP);
      if(k.includes('n'))n.t=Math.min(Math.round(o.t+dy),o.b-MINP);
      if(k.includes('s'))n.b=Math.max(Math.round(o.b+dy),o.t+MINP);
      if(!okSize(n.r-n.l,n.b-n.t)){$('#pfHelp').textContent='הגעתם לגודל המקסימלי של הדף.';return;}
      $('#pfHelp').textContent=HELP_PAGE;
    }
    framing.f=n;layoutFrame();
  });
  const up=e=>{if(hd&&e.pointerId===hd.id)hd=null;e.stopPropagation();};
  h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
}
$('#psize').addEventListener('click',()=>enterFrame('page'));
$('#pfCancel').addEventListener('click',exitFrame);
$('#pfReset').addEventListener('click',()=>{if(framing&&framing.mode==='page'){framing.f={l:0,t:0,r:W,b:H};layoutFrame();}});
$('#pfOk').addEventListener('click',()=>{
  if(!framing)return;const f=framing.f;
  if(framing.mode==='page'){if(!(f.l===0&&f.t===0&&f.r===W&&f.b===H))doResize(f.l,f.t,f.r,f.b,true);}
  else{mctx.save();mctx.imageSmoothingQuality='high';mctx.drawImage(framing.cv,f.l,f.t,f.r-f.l,f.b-f.t);mctx.restore();commitPatch([f.l,f.t,f.r,f.b]);hideHint();}
  exitFrame();
});
function setPageSize(nw,nh,snap,ox,oy){
  const pw=Math.round(nw*DPR),ph=Math.round(nh*DPR);
  for(const c of [main,shadow]){c.width=pw;c.height=ph;c.getContext('2d').drawImage(snap,ox,oy);}
  live.width=pw;live.height=ph;
  main.style.width=live.style.width=nw+'px';main.style.height=live.style.height=nh+'px';
  W=nw;H=nh;world.style.width=W+'px';world.style.height=H+'px';mctx.setTransform(DPR,0,0,DPR,0,0);lctx.setTransform(DPR,0,0,DPR,0,0);updateFrameSize();
}
function doResize(l,t,r,b,push){
  const snap=document.createElement('canvas');snap.width=main.width;snap.height=main.height;snap.getContext('2d').drawImage(main,0,0);
  const entry={resize:true,l,t,r,b,snap,oW:W,oH:H,oFixed:pageFixed};
  setPageSize(r-l,b-t,snap,Math.round(-l*DPR),Math.round(-t*DPR));
  const [dx,dy]=rot(l*vz,t*vz,va);vx+=dx;vy+=dy;pageFixed=true;applyView();
  scheduleSave();
  if(push){
    hist.length=hi;let k=-1;for(let i=hist.length-1;i>=0;i--)if(hist[i].resize){k=i;break;}
    if(k>=0)hist.splice(0,k+1); // only one full snapshot is kept, to save memory
    hist.push(entry);hi=hist.length;syncBtns();
  }else hist[hi-1]=entry;
}
function unResize(e){
  setPageSize(e.oW,e.oH,e.snap,0,0);
  const [dx,dy]=rot(e.l*vz,e.t*vz,va);vx-=dx;vy-=dy;pageFixed=e.oFixed;applyView();scheduleSave();
}
$('#imgBtn').addEventListener('click',()=>{setDrawer(false);$('#imgIn').click();});
$('#imgIn').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;
  try{
    let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'});}catch(_){bmp=await createImageBitmap(file);}
    const sc=Math.min(1,4096/Math.max(bmp.width,bmp.height)),cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(bmp.width*sc));cv.height=Math.max(1,Math.round(bmp.height*sc));
    const c=cv.getContext('2d');c.imageSmoothingQuality='high';c.drawImage(bmp,0,0,cv.width,cv.height);if(bmp.close)bmp.close();
    enterFrame('image',cv);
  }catch(_){hint.textContent='לא הצלחנו לפתוח את הקובץ הזה.';hint.hidden=false;}
});

/* ---------- wooden frame ---------- */
const wf=$('#wf'),ish=$('#ish'),frameBtn=$('#frameBtn');
let frameOn=true;try{frameOn=localStorage.getItem('frameOn')!=='0';}catch(_){}
const rawFt=()=>clamp(Math.min(W,H)*.05,16,56),frameT=()=>frameOn?rawFt():0;
function updateFrameSize(){world.style.setProperty('--ft',rawFt()+'px');}
function setFrame(o,keep){frameOn=o;wf.hidden=ish.hidden=!o;frameBtn.setAttribute('aria-pressed',o?'true':'false');if(keep)try{localStorage.setItem('frameOn',o?'1':'0');}catch(_){}}
frameBtn.addEventListener('click',()=>setFrame(!frameOn,true));
setFrame(frameOn,false);

/* draws the wooden frame (same look as the on-screen one) around a W x H page placed at (ft,ft); k = canvas scale, for shadows */
function paintFrame(c,W,H,ft,k){
  const TW=W+2*ft,TH=H+2*ft;
  c.save();c.beginPath();c.rect(ft,ft,W,H);c.clip();c.fillStyle='#000';
  const ring=()=>{c.beginPath();c.rect(-TW,-TH,TW*3,TH*3);c.rect(ft,ft,W,H);};
  ring();c.shadowColor='rgba(45,28,6,.55)';c.shadowBlur=ft*1.1*k;c.shadowOffsetX=ft*.12*k;c.shadowOffsetY=ft*.2*k;c.fill('evenodd');
  ring();c.shadowColor='rgba(45,28,6,.28)';c.shadowBlur=ft*.8*k;c.shadowOffsetX=0;c.shadowOffsetY=0;c.fill('evenodd');
  c.restore();
  const g=(x0,y0,x1,y1,a,b)=>{const q=c.createLinearGradient(x0,y0,x1,y1);q.addColorStop(0,a);q.addColorStop(1,b);return q;};
  const piece=(pts,grad,vertical)=>{
    c.save();c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.clip();
    c.fillStyle=grad;c.fillRect(0,0,TW,TH);c.fillStyle='rgba(110,70,25,.07)';
    if(vertical)for(let x=0;x<TW;x+=6)c.fillRect(x,0,1,TH);else for(let y=0;y<TH;y+=6)c.fillRect(0,y,TW,1);
    c.restore();
  };
  piece([[0,0],[TW,0],[TW-ft,ft],[ft,ft]],g(0,0,0,ft,'#efd7ae','#dfc08f'),false);
  piece([[0,TH],[TW,TH],[TW-ft,TH-ft],[ft,TH-ft]],g(0,TH-ft,0,TH,'#c9a673','#b58d5a'),false);
  piece([[0,0],[ft,ft],[ft,TH-ft],[0,TH]],g(0,0,ft,0,'#e0c293','#d2b180'),true);
  piece([[TW,0],[TW,TH],[TW-ft,TH-ft],[TW-ft,ft]],g(TW-ft,0,TW,0,'#c19d6a','#b08855'),true);
  c.lineWidth=1;c.strokeStyle='rgba(255,240,210,.55)';c.strokeRect(.5,.5,TW-1,TH-1);
  c.lineWidth=3;c.strokeStyle='rgba(255,235,200,.22)';c.strokeRect(ft-1.5,ft-1.5,W+3,H+3);
  c.lineWidth=1.5;c.strokeStyle='rgba(70,45,15,.65)';c.strokeRect(ft-.75,ft-.75,W+1.5,H+1.5);
}

/* ---------- autosave: the drawing comes back after a crash or accidental close ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('brush-studio',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
let saveT=0,restoring=true;
function scheduleSave(){if(restoring)return;clearTimeout(saveT);saveT=setTimeout(()=>saveNow().catch(()=>{}),900);}
async function saveNow(){
  if(restoring||!W)return;clearTimeout(saveT);saveT=0;
  const blob=await new Promise(res=>main.toBlob(res,'image/png'));if(!blob)return;
  await idbSet('doc',{blob,w:W,h:H,dpr:DPR,paper:app.dataset.paper,fixed:pageFixed,view:{vx,vy,vz,va},color:st.color,brush:lastDrawBrush.id,size:st.size});
}
let viewT=0;
function viewChanged(){if(restoring)return;clearTimeout(viewT);viewT=setTimeout(scheduleSave,1500);}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow().catch(()=>{});});
addEventListener('pagehide',()=>{saveNow().catch(()=>{});});
async function restore(){
  try{
    const d=await idbGet('doc');
    if(d&&d.blob&&!hist.length&&d.w>0&&d.h>0){
      const bmp=await createImageBitmap(d.blob),t=document.createElement('canvas');t.width=t.height=1;
      setPageSize(d.w,d.h,t,0,0);
      mctx.save();mctx.setTransform(1,0,0,1,0,0);mctx.drawImage(bmp,0,0,main.width,main.height);mctx.restore();
      if(bmp.close)bmp.close();
      shadow.getContext('2d').drawImage(main,0,0);
      pageFixed=!!d.fixed;app.dataset.paper=d.paper==='dark'?'dark':'light';
      if(d.view&&[d.view.vx,d.view.vy,d.view.vz,d.view.va].every(Number.isFinite)){vx=d.view.vx;vy=d.view.vy;vz=d.view.vz;va=d.view.va;}
      applyView();
      const b=BR.find(x=>x.id===d.brush);if(b&&!b.pick)selectBrush(b);
      if(Number.isFinite(d.size)&&d.size>=1&&d.size<=120){st.size=cur.size=d.size;$('#size').value=d.size;$('#sizeOut').textContent=d.size;}
      if(/^#[0-9a-f]{6}$/i.test(d.color||''))setColor(d.color);
      hideHint();queuePreviews();
    }
  }catch(_){}
  restoring=false;
}

/* ---------- feedback ---------- */
const FEEDBACK_URL='https://brush-feedback.ofer-bechor.workers.dev';
const fb=$('#fb'),fbText=$('#fbText'),fbMsg=$('#fbMsg'),fbSend=$('#fbSend'),fbMic=$('#fbMic'),FB_DEF=fbMsg.textContent;
let fbKind='idea',fbVoice=false,rec=null,fbLast=0;
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch(_){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(_){}};
$('#fbSec').hidden=!FEEDBACK_URL;
async function postFb(item){const r=await fetch(FEEDBACK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});const j=await r.json().catch(()=>null);if(!r.ok||!j||j.ok!==true)throw new Error('rejected');}
async function flushFb(){
  if(!FEEDBACK_URL)return;let q=lsGet('fbq')||[];if(!q.length)return;
  const left=[];for(const it of q){try{await postFb(it);}catch(_){left.push(it);}}lsSet('fbq',left);
}
addEventListener('online',flushFb);setTimeout(flushFb,3000);
document.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{fbKind=ch.dataset.kind;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===ch?'true':'false'));}));
$('#fbOpen').addEventListener('click',()=>{setDrawer(false);fbMsg.textContent=FB_DEF;fb.hidden=false;fbText.focus();});
function closeFb(){stopRec();fb.hidden=true;}
$('#fbClose').addEventListener('click',closeFb);
fb.addEventListener('click',e=>{if(e.target===fb)closeFb();});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)fbMic.hidden=true;
let listening=false,committed='',pend='',quiet=0;
function stopRec(){listening=false;if(rec){try{rec.stop();}catch(_){}}fbMic.setAttribute('aria-pressed','false');}
function listen(){
  const r=new SR();rec=r;r.lang='he-IL';r.interimResults=true;r.continuous=false;let got=false;
  r.onresult=e=>{
    let fin='',tmp='';
    for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else tmp+=t;}
    got=true;fbVoice=true;
    if(fin)committed=(committed?committed+' ':'')+fin.trim();
    pend=tmp.trim();
    fbText.value=pend?(committed?committed+' ':'')+pend:committed;
  };
  r.onerror=e=>{
    if(e.error==='no-speech'||e.error==='aborted')return;
    listening=false;
    fbMsg.textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'אין הרשאה למיקרופון. אפשר ללחוץ על המיקרופון במקלדת.':'ההקלטה לא הצליחה. אפשר ללחוץ על המיקרופון במקלדת.';
  };
  r.onend=()=>{
    if(rec===r)rec=null;
    if(pend){committed=(committed?committed+' ':'')+pend;pend='';fbText.value=committed;}
    if(listening&&(got?(quiet=0,true):++quiet<2)){setTimeout(()=>{if(listening){try{listen();}catch(_){stopRec();}}},150);}
    else{stopRec();if(fbMsg.textContent.startsWith('מקשיבים'))fbMsg.textContent=FB_DEF;}
  };
  r.start();
}
fbMic.addEventListener('click',()=>{
  if(listening){stopRec();return;}
  try{committed=fbText.value.trim();pend='';quiet=0;listening=true;fbMic.setAttribute('aria-pressed','true');fbMsg.textContent='מקשיבים. לחצו שוב על "הקלטה" כדי לעצור.';listen();}
  catch(_){listening=false;rec=null;fbMic.setAttribute('aria-pressed','false');fbMsg.textContent='ההקלטה לא זמינה כאן. אפשר ללחוץ על המיקרופון במקלדת.';}
});
fbSend.addEventListener('click',async()=>{
  const text=fbText.value.trim();
  if(text.length<3){fbMsg.textContent='כתבו לפחות כמה מילים.';return;}
  if(Date.now()-fbLast<8000){fbMsg.textContent='אפשר לשלוח שוב בעוד כמה שניות.';return;}
  stopRec();
  fbLast=Date.now();fbSend.disabled=true;
  const item={kind:fbKind,text,voice:fbVoice,version:APP_VERSION,input:lastInput,screen:innerWidth+'x'+innerHeight,lang:navigator.language,website:$('#fbWebsite').value};
  try{await postFb(item);fbMsg.textContent='תודה, ההערה נשלחה.';fbText.value='';fbVoice=false;}
  catch(_){const q=lsGet('fbq')||[];q.push(item);lsSet('fbq',q.slice(-20));fbMsg.textContent='אין חיבור כרגע. ההערה נשמרה ותישלח בפעם הבאה שהאפליקציה תיפתח.';fbText.value='';fbVoice=false;}
  fbSend.disabled=false;
});

syncCp();fit();renderPreviews();syncBtns();restore();

/* ---------- install + updates ---------- */
if('serviceWorker' in navigator){
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const offer=w=>{$('#upd').hidden=false;$('#updGo').onclick=async()=>{try{await saveNow();}catch(_){}w.postMessage('SKIP_WAITING');};};
      if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
      reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
        w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)offer(w);});});
      setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
    }).catch(()=>{});
    let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload();});
  });
}
$('#updLater').addEventListener('click',()=>{$('#upd').hidden=true;});
})();
